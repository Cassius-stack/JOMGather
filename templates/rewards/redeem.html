{% extends "base.html" %}

{% block title %}Rewards - JOMGather{% endblock %}

{% block content %}

<div class="main-container">
    <h2 class="section-title">Balance</h2>
    <div class="balance-card">
        <img src="{{ url_for('static', filename='images/credit.svg') }}" class="credit-icon">
        <div class="balance-info">
            <span class="label">Your coins</span>
            <span class="value">{{ coins | default('0') }}</span>
        </div>
    </div>
    <h2 class="section-title">Available Rewards</h2>
    <div class="rewards-grid">
        {% for reward in rewards %}
        <div class="reward-card">
            <div class="card-image">
                <img src="{{ url_for('static', filename='images/' + reward.image) }}" class="reward-image">
            </div>
            <div class="reward-info">
                <h3>{{ reward.name }}</h3>
                <div class="price">
                    <img src="{{ url_for('static', filename='images/credit.svg') }}" class="credit-icon-small">
                    <span>{{ reward.price }}</span>
                </div>
                <button class="btn-redeem{% if coins < reward.price %} disabled{% endif %}">
                    Redeem
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
