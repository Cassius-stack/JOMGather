<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .emoji-btn:hover {
            transform: scale(1.2);
        }

        .message-hover-controls {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-group:hover .message-hover-controls {
            opacity: 1;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="app" class="flex h-screen"></div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        let state = {
            communities: [],
            notifications: [],
            currentUser: null,
            activeCommunityId: null,
            activeChannelId: null,
            activeTab: 'channels',
            searchQuery: '',
            messageSearchQuery: '',
            messageText: '',
            editingMessageId: null,
            editMessageText: '',
            replyingTo: null,
            showEmojiPicker: null,
            showReactionPicker: null,
            showAddChannel: false,
            showAddCommunity: false,
            showCommunityList: false,
            showChannelSettings: false,
            showCommunitySettings: false,
            showManageRoles: false,
            showNotifications: false,
            messageMenuId: null,
            newChannelName: '',
            newChannelIsAnnouncement: false,
            newCommunityName: '',
            newCommunityDesc: ''
        };

        const emojis = ['👍', '❤️', '😂', '😮', '😢', '🙏', '🎉', '🔥'];
        const messageEmojis = ['😊', '😂', '❤️', '👍', '🎉', '🤔', '😎', '🙌', '👏', '🔥', '💯', '✨'];

        // API calls
        async function fetchCommunities() {
            const res = await fetch(`${API_BASE}/communities`);
            state.communities = await res.json();
            if (!state.activeCommunityId && state.communities.length > 0) {
                state.activeCommunityId = state.communities[0].id;
            }
            render();
        }

        async function fetchNotifications() {
            const res = await fetch(`${API_BASE}/notifications`);
            state.notifications = await res.json();
            render();
        }

        async function fetchCurrentUser() {
            const res = await fetch(`${API_BASE}/user`);
            state.currentUser = await res.json();
            render();
        }

        async function createCommunity() {
            if (!state.newCommunityName.trim()) return;

            const res = await fetch(`${API_BASE}/communities`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: state.newCommunityName,
                    description: state.newCommunityDesc
                })
            });

            const newCommunity = await res.json();
            state.communities.push(newCommunity);
            state.activeCommunityId = newCommunity.id;
            state.newCommunityName = '';
            state.newCommunityDesc = '';
            state.showAddCommunity = false;
            state.showCommunityList = false;
            render();
        }

        async function deleteCommunity() {
            if (!confirm('Delete this community? This cannot be undone.')) return;

            await fetch(`${API_BASE}/communities/${state.activeCommunityId}`, {
                method: 'DELETE'
            });

            state.communities = state.communities.filter(c => c.id !== state.activeCommunityId);
            state.activeCommunityId = state.communities[0]?.id || null;
            state.activeChannelId = null;
            state.showCommunitySettings = false;
            render();
        }

        async function createChannel() {
            if (!state.newChannelName.trim()) return;

            const res = await fetch(`${API_BASE}/communities/${state.activeCommunityId}/channels`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: state.newChannelName,
                    isAnnouncement: state.newChannelIsAnnouncement
                })
            });

            const newChannel = await res.json();
            const community = state.communities.find(c => c.id === state.activeCommunityId);
            community.channels.push(newChannel);
            state.newChannelName = '';
            state.newChannelIsAnnouncement = false;
            state.showAddChannel = false;
            render();
        }

        async function deleteChannel() {
            if (!confirm('Delete this channel? This cannot be undone.')) return;

            await fetch(`${API_BASE}/communities/${state.activeCommunityId}/channels/${state.activeChannelId}`, {
                method: 'DELETE'
            });

            const community = state.communities.find(c => c.id === state.activeCommunityId);
            community.channels = community.channels.filter(ch => ch.id !== state.activeChannelId);
            state.activeChannelId = null;
            state.showChannelSettings = false;
            render();
        }

        async function sendMessage() {
            if (!state.messageText.trim()) return;

            const res = await fetch(
                `${API_BASE}/communities/${state.activeCommunityId}/channels/${state.activeChannelId}/messages`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: state.messageText,
                        replyTo: state.replyingTo
                    })
                }
            );

            const newMessage = await res.json();
            const community = state.communities.find(c => c.id === state.activeCommunityId);
            const channel = community.channels.find(ch => ch.id === state.activeChannelId);
            channel.messages.push(newMessage);

            state.messageText = '';
            state.replyingTo = null;
            render();
            await fetchNotifications();
        }

        async function editMessage() {
            if (!state.editMessageText.trim()) return;

            const res = await fetch(
                `${API_BASE}/communities/${state.activeCommunityId}/channels/${state.activeChannelId}/messages/${state.editingMessageId}`,
                {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: state.editMessageText })
                }
            );

            const updatedMessage = await res.json();
            const community = state.communities.find(c => c.id === state.activeCommunityId);
            const channel = community.channels.find(ch => ch.id === state.activeChannelId);
            const msgIndex = channel.messages.findIndex(m => m.id === state.editingMessageId);
            channel.messages[msgIndex] = updatedMessage;

            state.editingMessageId = null;
            state.editMessageText = '';
            render();
        }

        async function deleteMessage(messageId) {
            await fetch(
                `${API_BASE}/communities/${state.activeCommunityId}/channels/${state.activeChannelId}/messages/${messageId}`,
                { method: 'DELETE' }
            );

            const community = state.communities.find(c => c.id === state.activeCommunityId);
            const channel = community.channels.find(ch => ch.id === state.activeChannelId);
            channel.messages = channel.messages.filter(m => m.id !== messageId);
            state.messageMenuId = null;
            render();
        }

        async function addReaction(messageId, emoji) {
            const res = await fetch(
                `${API_BASE}/communities/${state.activeCommunityId}/channels/${state.activeChannelId}/messages/${messageId}/reactions`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emoji })
                }
            );

            const reactions = await res.json();
            const community = state.communities.find(c => c.id === state.activeCommunityId);
            const channel = community.channels.find(ch => ch.id === state.activeChannelId);
            const message = channel.messages.find(m => m.id === messageId);
            message.reactions = reactions;

            state.showReactionPicker = null;
            render();
            await fetchNotifications();
        }

        async function markNotificationRead(notifId) {
            await fetch(`${API_BASE}/notifications/${notifId}/read`, { method: 'POST' });
            const notif = state.notifications.find(n => n.id === notifId);
            if (notif) notif.read = true;
            render();
        }

        async function markAllNotificationsRead() {
            await fetch(`${API_BASE}/notifications/read-all`, { method: 'POST' });
            state.notifications.forEach(n => n.read = true);
            render();
        }

        async function toggleUserRole(userId, role) {
            const res = await fetch(`${API_BASE}/communities/${state.activeCommunityId}/roles`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, role })
            });

            const updatedCommunity = await res.json();
            const communityIndex = state.communities.findIndex(c => c.id === state.activeCommunityId);
            state.communities[communityIndex] = updatedCommunity;
            render();
        }

        // Helper functions
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            return `${days}d ago`;
        }

        function getActiveCommunity() {
            return state.communities.find(c => c.id === state.activeCommunityId);
        }

        function getActiveChannel() {
            const community = getActiveCommunity();
            return community?.channels.find(ch => ch.id === state.activeChannelId);
        }

        function isUserAdmin() {
            const community = getActiveCommunity();
            return community?.admins.includes(state.currentUser?.id);
        }

        function isUserModerator() {
            const community = getActiveCommunity();
            return community?.moderators.includes(state.currentUser?.id);
        }

        function hasModPermissions() {
            return isUserAdmin() || isUserModerator();
        }

        // Render functions
        function render() {
            const app = document.getElementById('app');
            const community = getActiveCommunity();
            const channel = getActiveChannel();
            const unreadCount = state.notifications.filter(n => !n.read).length;

            app.innerHTML = `
                ${state.showCommunityList ? renderCommunityList() : ''}
                
                <!-- Sidebar -->
                <div class="w-80 bg-white border-r border-gray-200 flex flex-col">
                    <!-- Header -->
                    <div class="p-4 border-b border-gray-200">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3 flex-1">
                                <button onclick="state.showCommunityList = true; render();" 
                                    class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center hover:bg-green-600">
                                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                    </svg>
                                </button>
                                <div class="flex-1 min-w-0">
                                    <h1 class="font-semibold text-lg truncate">${community?.name || ''}</h1>
                                    <p class="text-sm text-gray-500">${community?.members || 0} members</p>
                                </div>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="state.showNotifications = !state.showNotifications; render();" 
                                    class="p-2 hover:bg-gray-100 rounded-full relative">
                                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                                    </svg>
                                    ${unreadCount > 0 ? `<div class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">${unreadCount}</div>` : ''}
                                </button>
                                <button onclick="state.showCommunitySettings = true; render();" class="p-2 hover:bg-gray-100 rounded-full">
                                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <input type="text" placeholder="Search channels..." 
                            value="${state.searchQuery}"
                            oninput="state.searchQuery = this.value; render();"
                            class="w-full px-10 py-2 bg-gray-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    ${state.showNotifications ? renderNotifications() : ''}

                    <!-- Tabs -->
                    <div class="flex border-b border-gray-200">
                        <button onclick="state.activeTab = 'channels'; render();" 
                            class="flex-1 py-3 text-sm font-medium ${state.activeTab === 'channels' ? 'text-green-600 border-b-2 border-green-600' : 'text-gray-600'}">
                            Channels
                        </button>
                        <button onclick="state.activeTab = 'members'; render();" 
                            class="flex-1 py-3 text-sm font-medium ${state.activeTab === 'members' ? 'text-green-600 border-b-2 border-green-600' : 'text-gray-600'}">
                            Members
                        </button>
                    </div>

                    <!-- Content -->
                    <div class="flex-1 overflow-y-auto">
                        ${state.activeTab === 'channels' ? renderChannelsList(community) : renderMembersList(community)}
                    </div>

                    <!-- About -->
                    <div class="p-4 bg-gray-50 border-t border-gray-200">
                        <p class="text-xs text-gray-600 mb-2">About this community</p>
                        <p class="text-sm text-gray-800">${community?.description || ''}</p>
                    </div>
                </div>

                <!-- Chat Area -->
                ${channel ? renderChatArea(channel) : renderWelcomeScreen(community)}

                <!-- Modals -->
                ${state.showAddChannel ? renderAddChannelModal() : ''}
                ${state.showAddCommunity ? renderAddCommunityModal() : ''}
                ${state.showChannelSettings ? renderChannelSettingsModal(channel) : ''}
                ${state.showCommunitySettings ? renderCommunitySettingsModal(community) : ''}
                ${state.showManageRoles ? renderManageRolesModal(community) : ''}
            `;
        }

        function renderCommunityList() {
            return `
                <div class="fixed inset-0 bg-black bg-opacity-50 z-40" onclick="state.showCommunityList = false; render();">
                    <div class="w-80 bg-white h-full shadow-xl" onclick="event.stopPropagation();">
                        <div class="p-4 border-b border-gray-200">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-lg font-semibold">Your Communities</h2>
                                <button onclick="state.showCommunityList = false; render();" class="p-2 hover:bg-gray-100 rounded-full">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="overflow-y-auto h-full pb-32">
                            ${state.communities.map(c => `
                                <div onclick="state.activeCommunityId = ${c.id}; state.activeChannelId = null; state.showCommunityList = false; render();"
                                    class="p-4 cursor-pointer border-b border-gray-100 hover:bg-gray-50 ${c.id === state.activeCommunityId ? 'bg-green-50' : ''}">
                                    <div class="flex items-center gap-3">
                                        <div class="w-12 h-12 rounded-full flex items-center justify-center ${c.id === state.activeCommunityId ? 'bg-green-500' : 'bg-gray-300'}">
                                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                            </svg>
                                        </div>
                                        <div class="flex-1">
                                            <h3 class="font-semibold text-sm">${c.name}</h3>
                                            <p class="text-xs text-gray-500">${c.members} members</p>
                                        </div>
                                        ${c.id === state.activeCommunityId ? '<div class="w-2 h-2 bg-green-500 rounded-full"></div>' : ''}
                                    </div>
                                </div>
                            `).join('')}
                            <button onclick="state.showAddCommunity = true; state.showCommunityList = false; render();"
                                class="w-full p-4 flex items-center gap-3 hover:bg-gray-50 text-green-600 border-b border-gray-100">
                                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                    </svg>
                                </div>
                                <span class="font-medium text-sm">Create New Community</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderNotifications() {
            return `
                <div class="absolute top-20 right-4 w-80 bg-white border border-gray-200 rounded-lg shadow-xl z-50">
                    <div class="p-3 border-b border-gray-200 flex items-center justify-between">
                        <h3 class="font-semibold">Notifications</h3>
                        <button onclick="markAllNotificationsRead();" class="text-xs text-green-600 hover:underline">
                            Mark all read
                        </button>
                    </div>
                    <div class="max-h-96 overflow-y-auto">
                        ${state.notifications.length === 0 ?
                    '<div class="p-4 text-center text-gray-500 text-sm">No notifications</div>' :
                    state.notifications.map(n => `
                                <div onclick="markNotificationRead(${n.id});"
                                    class="p-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer ${!n.read ? 'bg-green-50' : ''}">
                                    <p class="text-sm">${n.text}</p>
                                    <p class="text-xs text-gray-500 mt-1">${formatTime(n.timestamp)}</p>
                                </div>
                            `).join('')
                }
                    </div>
                </div>
            `;
        }

        function renderChannelsList(community) {
            if (!community) return '<div class="p-4 text-center text-gray-500">Select a community</div>';

            const filteredChannels = community.channels.filter(ch =>
                ch.name.toLowerCase().includes(state.searchQuery.toLowerCase())
            );

            return `
                ${filteredChannels.map(ch => `
                    <div onclick="state.activeChannelId = ${ch.id}; render();"
                        class="p-4 hover:bg-gray-50 cursor-pointer border-b border-gray-100 ${ch.id === state.activeChannelId ? 'bg-green-50' : ''}">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3 flex-1">
                                <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">
                                    ${ch.isAnnouncement ?
                    '<svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>' :
                    '<svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path></svg>'
                }
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-medium text-sm">${ch.name}</h3>
                                        ${ch.isAnnouncement ? '<svg class="w-3 h-3 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>' : ''}
                                    </div>
                                    <p class="text-xs text-gray-500">${ch.members} members</p>
                                </div>
                            </div>
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>
                `).join('')}
                <button onclick="state.showAddChannel = true; render();"
                    class="w-full p-4 flex items-center gap-3 hover:bg-gray-50 text-green-600">
                    <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                    </div>
                    <span class="font-medium text-sm">Create New Channel</span>
                </button>
            `;
        }

        function renderMembersList(community) {
            if (!community) return '<div class="p-4 text-center text-gray-500">Select a community</div>';

            return `
                <div class="p-4">
                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-xs font-semibold text-gray-500 uppercase">Admins</h3>
                            ${hasModPermissions() ? `<button onclick="state.showManageRoles = true; render();" class="text-xs text-green-600 hover:underline">Manage</button>` : ''}
                        </div>
                        <div class="space-y-2">
                            ${community.admins.map(adminId => `
                                <div class="flex items-center gap-3 p-2 rounded hover:bg-gray-50">
                                    <div class="w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center text-white text-sm font-semibold">
                                        ${adminId === 1 ? 'Y' : 'A'}
                                    </div>
                                    <div class="flex-1">
                                        <p class="text-sm font-medium">${adminId === 1 ? 'You' : `Admin ${adminId}`}</p>
                                        <p class="text-xs text-gray-500">Administrator</p>
                                    </div>
                                    <svg class="w-4 h-
