{% extends "base.html" %}

{% block title %}{{ title or 'Error' }} - MySavvyGranny{% endblock %}

{% block content %}
<div style="background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); min-height: calc(100vh - 70px);">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div
                    style="background: white; border-radius: 24px; padding: 3rem 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06);">
                    <div
                        style="width: 80px; height: 80px; border-radius: 50%; background: #fef3c7; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                        <i class="bi bi-exclamation-triangle-fill" style="font-size: 2rem; color: #f59e0b;"></i>
                    </div>
                    <h2 style="font-weight: 700; color: #1e3a5f; margin-bottom: 0.75rem;">{{ title or 'Something went
                        wrong' }}</h2>
                    <p style="color: #64748b; font-size: 1.05rem; line-height: 1.6; margin-bottom: 2rem;">
                        {{ message or 'An unexpected error occurred. Please try again later.' }}
                    </p>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">
                        <i class="bi bi-house me-2"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
