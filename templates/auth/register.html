{% extends "base.html" %}

{% block title %}Register - JomGather{% endblock %}

{% block content %}
<div
    style="background: linear-gradient(135deg, #e8f4fc 0%, #f1f5f9 100%); min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div
        style="background: white; border-radius: 24px; padding: 3rem; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(30, 58, 95, 0.1);">

        <!-- Header -->
        <div class="text-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 700; color: #1e3a5f; margin-bottom: 0.5rem;">Create Account</h1>
            <p style="color: #64748b;">Join the community connecting generations</p>
        </div>

        <!-- Progress Dots -->
        <div style="display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 2rem;">
            <div style="height: 10px; width: 10px; border-radius: 50%; background: #1e3a5f; transition: all 0.3s;">
            </div>
            <div style="height: 10px; width: 10px; border-radius: 50%; background: #e2e8f0; transition: all 0.3s;">
            </div>
            <div style="height: 10px; width: 10px; border-radius: 50%; background: #e2e8f0; transition: all 0.3s;">
            </div>
        </div>

        <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Step 1 of 3: Account
            Information</p>

        <!-- Form -->
        <form id="register-form">
            <!-- Username -->
            <div class="mb-3">
                <label for="username"
                    style="display: block; margin-bottom: 0.5rem; color: #334155; font-weight: 500;">Username</label>
                <input type="text" id="username" name="username" required
                    style="width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem;"
                    placeholder="What should we call you?">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email"
                    style="display: block; margin-bottom: 0.5rem; color: #334155; font-weight: 500;">Email
                    Address</label>
                <input type="email" id="email" name="email" required
                    style="width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem;"
                    placeholder="e.g. grandma@example.com">
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password"
                    style="display: block; margin-bottom: 0.5rem; color: #334155; font-weight: 500;">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                    style="width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem;"
                    placeholder="At least 6 characters">
            </div>

            <button type="submit"
                style="width: 100%; background: #1e3a5f; color: white; border: none; padding: 1rem; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 1.5rem;">
                Next &rarr;
            </button>
        </form>

        <!-- Login Link -->
        <div class="text-center">
            <p style="color: #64748b;">Already have an account?
                <a href="{{ url_for('auth.login') }}"
                    style="color: #1e3a5f; font-weight: 600; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </div>
</div>

<script>
    // Load saved data if returning from onboarding
    document.addEventListener('DOMContentLoaded', function () {
        const savedData = sessionStorage.getItem('registrationData');
        if (savedData) {
            const data = JSON.parse(savedData);
            document.getElementById('username').value = data.username || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('password').value = data.password || '';
        }
    });

    // Save data and go to onboarding
    document.getElementById('register-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Validate
        if (!username || !email || !password) {
            alert('Please fill in all fields');
            return;
        }

        if (password.length < 6) {
            alert('Password must be at least 6 characters');
            return;
        }

        // Save to sessionStorage
        const existingData = sessionStorage.getItem('registrationData');
        let data = existingData ? JSON.parse(existingData) : {};
        data.username = username;
        data.email = email;
        data.password = password;
        sessionStorage.setItem('registrationData', JSON.stringify(data));

        // Navigate to onboarding
        window.location.href = "{{ url_for('auth.onboarding') }}";
    });
</script>
{% endblock %}
