{% extends "base.html" %}

{% block title %}Login - JomGather{% endblock %}

{% block content %}
<div
    style="background: linear-gradient(135deg, #e8f4fc 0%, #f1f5f9 100%); min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div
        style="background: white; border-radius: 24px; padding: 3rem; width: 100%; max-width: 450px; box-shadow: 0 10px 40px rgba(30, 58, 95, 0.1);">

        <!-- Header -->
        <div class="text-center mb-4">
            <div
                style="width: 60px; height: 60px; background: #e0f2fe; border-radius: 50%; color: #1e3a5f; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.75rem;">
                <i class="bi bi-person-circle"></i>
            </div>
            <h1 style="font-size: 2rem; font-weight: 700; color: #1e3a5f; margin-bottom: 0.5rem;">Welcome Back</h1>
            <p style="color: #64748b;">Log in to continue sharing moments</p>
        </div>

        <!-- Form -->
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="email"
                    style="display: block; margin-bottom: 0.5rem; color: #334155; font-weight: 500;">Email
                    Address</label>
                <div class="input-group">
                    <span class="input-group-text"
                        style="background: #f8fafc; border: 2px solid #e2e8f0; border-right: none;"><i
                            class="bi bi-envelope text-muted"></i></span>
                    <input type="email" id="email" name="email" required
                        style="flex: 1; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 0 12px 12px 0; font-size: 1rem; transition: border-color 0.2s;"
                        placeholder="e.g. grandma@example.com">
                </div>
            </div>

            <div class="mb-4">
                <label for="password"
                    style="display: block; margin-bottom: 0.5rem; color: #334155; font-weight: 500;">Password</label>
                <div class="input-group">
                    <span class="input-group-text"
                        style="background: #f8fafc; border: 2px solid #e2e8f0; border-right: none;"><i
                            class="bi bi-lock text-muted"></i></span>
                    <input type="password" id="password" name="password" required
                        style="flex: 1; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 0 12px 12px 0; font-size: 1rem;"
                        placeholder="Enter your password">
                </div>
            </div>

            <button type="submit"
                style="width: 100%; background: #1e3a5f; color: white; border: none; padding: 1rem; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 1.5rem;">
                Log In
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center pt-3" style="border-top: 1px solid #e2e8f0;">
            <p style="color: #64748b; margin-bottom: 0.5rem;">Don't have an account?</p>
            <a href="{{ url_for('auth.register') }}"
                style="color: #1e3a5f; font-weight: 600; text-decoration: none;">Create New Account</a>
        </div>
    </div>
</div>
{% endblock %}
