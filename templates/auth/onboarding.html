{% extends "base.html" %}

{% block title %}Register - JOMGather{% endblock %}

{% block content %}
<!-- TODO: Team member to implement registration page -->
<div class="container">
    <h1>Register</h1>
    <!-- Progress Dots -->
    <div class="flex justify-center mb-6 space-x-2">
        <div id="dot-1" class="h-2 w-2 rounded-full bg-indigo-600 transition-all duration-300"></div>
        <div id="dot-2" class="h-2 w-2 rounded-full bg-gray-300 transition-all duration-300"></div>
        <div id="dot-3" class="h-2 w-2 rounded-full bg-gray-300 transition-all duration-300"></div>
    </div>
    <form id="reg-form" onsubmit="event.preventDefault(); submitRegistration();">
        <!-- STEP 1: CREDENTIALS -->
        <div id="step-1">
            <label class="block text-sm font-bold text-gray-700 mb-1">Account Info</label>
            <div class="space-y-4">
                <input type="text" id="reg-username" placeholder="Username"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:outline-none">
                <input type="email" id="reg-email" placeholder="Email Address"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:outline-none">
                <input type="password" id="reg-password" placeholder="Create Password"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:outline-none">
            </div>
            <div class="mt-6 flex justify-end">
                <button type="button" onclick="nextStep(2)"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Next
                    &rarr;</button>
            </div>
        </div>
        <!-- STEP 2: DEMOGRAPHICS -->
        <div id="step-2" class="hidden-section">
            <label class="block text-sm font-bold text-gray-700 mb-1">About You</label>
            <div class="space-y-4">
                <input type="number" id="reg-age" placeholder="Age"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:outline-none">
                <select id="reg-region"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:outline-none bg-white">
                    <option value="" disabled selected>Select Region</option>
                    <option value="North">North</option>
                    <option value="South">South</option>
                    <option value="East">East</option>
                    <option value="West">West</option>
                </select>
            </div>
            <div class="mt-6 flex justify-between">
                <button type="button" onclick="nextStep(1)" class="text-gray-500 hover:text-gray-800">Back</button>
                <button type="button" onclick="nextStep(3)"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Next
                    &rarr;</button>
            </div>
        </div>

        <!-- STEP 3: INTERESTS -->
        <div id="step-3" class="hidden-section">
            <label class="block text-sm font-bold text-gray-700 mb-2">Interests & Skills</label>

            <!-- Hobbies Selection -->
            <p class="text-xs text-gray-500 mb-2">Select Hobbies:</p>
            <div class="flex flex-wrap gap-2 mb-4" id="hobbies-container">
                <!-- Generated by JS -->
            </div>

            <!-- Skills Input -->
            <p class="text-xs text-gray-500 mb-2">Add Skills:</p>
            <div class="flex gap-2 mb-2">
                <input type="text" id="skill-input" placeholder="Type skill..."
                    class="flex-1 p-2 border border-gray-300 rounded-lg text-sm">
                <button type="button" onclick="addSkill()"
                    class="bg-gray-800 text-white px-3 py-2 rounded-lg text-sm">Add</button>
            </div>
            <div id="skills-list" class="flex flex-wrap gap-2 min-h-[30px]"></div>

            <div class="mt-6 flex justify-between">
                <button type="button" onclick="nextStep(2)" class="text-gray-500 hover:text-gray-800">Back</button>
                <button type="submit"
                    class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold shadow-lg">Complete</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
