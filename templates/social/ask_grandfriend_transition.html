<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask A Grandfriend</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            /* Warm/Friendly gradient */
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            animation: finalZoomOut 1s cubic-bezier(0.25, 1, 0.5, 1) 2s forwards;
            /* Zoom out after words arrive */
        }

        .word {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            /* Start invisible */
            text-transform: uppercase;
        }

        /* Word 1: ASK - From Top Left */
        .word-1 {
            color: #D93025;
            /* Google Red-ish or deep warm color */
            animation: flyInTopLeft 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: 0.2s;
        }

        /* Word 2: A - From Top */
        .word-2 {
            color: #F9AB00;
            /* Yellow/Gold */
            animation: flyInTop 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: 0.6s;
        }

        /* Word 3: GRANDFRIEND - From Top Right */
        .word-3 {
            color: #1E8E3E;
            /* Green */
            animation: flyInTopRight 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            animation-delay: 1.0s;
        }

        @keyframes flyInTopLeft {
            0% {
                opacity: 0;
                transform: translate(-100vw, -100vh) scale(3) rotate(-20deg);
            }

            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
        }

        @keyframes flyInTop {
            0% {
                opacity: 0;
                transform: translate(0, -100vh) scale(3);
            }

            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes flyInTopRight {
            0% {
                opacity: 0;
                transform: translate(100vw, -100vh) scale(3) rotate(20deg);
            }

            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
        }

        @keyframes finalZoomOut {
            0% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .icon-container {
            position: absolute;
            bottom: -60px;
            font-size: 3rem;
            color: white;
            opacity: 0;
            animation: fadeInIcon 1s ease 2.2s forwards;
        }

        @keyframes fadeInIcon {
            to {
                opacity: 1;
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="word word-1">Ask</div>
        <div class="word word-2">A</div>
        <div class="word word-3">Grandfriend</div>
    </div>

    <div class="icon-container">
        ❤️
    </div>

    <!-- Redirect script -->
    <script>
        setTimeout(function () {
            window.location.href = "{{ url_for('social.ask_grandfriend_home') }}";
        }, 3500); // Redirect after animations
    </script>
</body>

</html>
