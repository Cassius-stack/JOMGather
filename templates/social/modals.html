<!-- Search Users Modal -->
<div class="modal fade" id="searchUsersModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px; border: none; overflow: hidden;">
            <div class="modal-header py-3 px-4" style="background: #1e3a5f; color: white; border: none;">
                <h4 class="modal-title fw-bold"><i class="bi bi-search me-2"></i>Find Friends</h4>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-5">
                <div class="input-group mb-4">
                    <span class="input-group-text p-3"
                        style="background: #f1f5f9; border: none; border-radius: 12px 0 0 12px;">
                        <i class="bi bi-search text-muted fs-4"></i>
                    </span>
                    <input type="text" id="userSearchInput" class="form-control fs-5 p-3"
                        placeholder="Search by username..."
                        style="background: #f1f5f9; border: none; border-radius: 0 12px 12px 0;">
                </div>

                <div id="searchResults" class="list-group list-group-flush">
                    <!-- Results will be injected here -->
                    <div class="text-center text-muted py-3">
                        <small class="fs-6">Type to search for people...</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Generic Profile Modal -->
<div class="modal fade" id="userProfileModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content"
            style="border-radius: 24px; border: none; background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);">
            <div class="modal-body text-center p-5 position-relative">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-4"
                    data-bs-dismiss="modal"></button>

                <!-- Avatar -->
                <div
                    style="width: 100px; height: 100px; background: #e0f2fe; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                    <i class="bi bi-person-fill" style="font-size: 3rem; color: #1e3a5f;"></i>
                </div>

                <!-- Info -->
                <h3 id="profileModalName" style="color: #1e3a5f; font-weight: 700; margin-bottom: 0.5rem;">Username</h3>
                <span id="profileModalType" class="badge rounded-pill bg-primary mb-4"
                    style="padding: 0.5rem 1rem; font-weight: 500; font-size: 0.9rem;">Senior</span>

                <!-- Stats (Mock) -->
                <div class="d-flex justify-content-center gap-4 mb-4">
                    <div>
                        <h5 style="font-weight: 700; color: #1e3a5f; margin: 0;">12</h5>
                        <small class="text-muted">Friends</small>
                    </div>
                    <div>
                        <h5 style="font-weight: 700; color: #1e3a5f; margin: 0;">5</h5>
                        <small class="text-muted">Badges</small>
                    </div>
                </div>

                <!-- Actions -->
                <div id="profileModalActions">
                    <button id="btnAddFriend" class="btn btn-primary w-100 py-2 rounded-pill fw-bold"
                        style="background: #1e3a5f; border: none;">
                        <i class="bi bi-person-plus me-2"></i>Add Friend
                    </button>
                    <button id="btnChatFriend" class="btn btn-success w-100 py-2 rounded-pill fw-bold"
                        style="display: none;">
                        <i class="bi bi-chat-dots me-2"></i>Message
                    </button>
                    <button id="btnRequestSent" class="btn btn-secondary w-100 py-2 rounded-pill fw-bold"
                        style="display: none;" disabled>
                        <i class="bi bi-check2 me-2"></i>Request Sent
                    </button>
                    <div id="btnIncomingRequest" style="display: none;" class="d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1 rounded-pill"
                            onclick="acceptRequest()">Accept</button>
                        <button class="btn btn-outline-danger flex-grow-1 rounded-pill">Decline</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
